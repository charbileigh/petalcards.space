services:
  petalcards:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      APP_ORIGIN: ${APP_ORIGIN:-}
    ports:
      - "${PETALCARDS_BIND:-127.0.0.1}:${PETALCARDS_PORT:-3000}:3000"
    volumes:
      - petalcards_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  petalcards_data:
